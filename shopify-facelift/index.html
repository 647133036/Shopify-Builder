<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARLOW — Neutral Minimal Facelift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131312'/%3E%3C/svg%3E">
  <meta http-equiv="refresh" content="0; url=preview/index.html">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="preview/preview.css">
  <style>
    .boot {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--c-bg, #ffffff);
      color: var(--c-ink-2, #4b4b47);
    }
    .boot__inner { text-align: center; }
    .boot__brand {
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--c-ink, #131312);
      margin-bottom: 14px;
    }
    .boot__link {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--c-ink-2, #4b4b47);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="boot">
    <div class="boot__inner">
      <p class="boot__brand">MARLOW</p>
      <p>Redirecting to the facelift preview&hellip;</p>
      <p><a class="boot__link" href="preview/index.html">Open the preview</a></p>
    </div>
  </main>
</body>
</html>
